[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memesense"
version = "0.1.0"
description = "Chinese meme understanding and QQ group bot project scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "Pillow>=10,<13", "ImageHash>=4.3,<5"]

[tool.setuptools.packages.find]
where = ["src"]
